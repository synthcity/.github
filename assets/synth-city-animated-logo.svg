  <rect width="357" height="111" rx="8" fill="#0a0a0a"/>
  <style>
    .write {
      fill: #fff;
      fill-opacity: 0;
      stroke: #fff;
      stroke-width: 1.5px;
      stroke-dasharray: 4000; /* Long enough to cover any letter */
      stroke-dashoffset: 4000;
      animation: write 2.5s ease-out forwards, fillIn 0.5s ease-out forwards;
    }
    
    @keyframes write {
      to { stroke-dashoffset: 0; }
    }
    
    @keyframes fillIn {
      from { fill-opacity: 0; }
      to { fill-opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) { .write { animation: none !important; fill-opacity: 1; stroke-dashoffset: 0; } }
  </style>
  
